name: AEGIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ingestion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ingestion dependencies
        run: python -m pip install -r requirements.txt
      - name: Run ingestion tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Compile ingestion service
        run: python -m compileall -q aegis_ingestion app.py

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet

  phase3-ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml/nlp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ML requirements
        run: python -m pip install -r requirements.txt
      - name: Run NLP tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Evaluate NLP baseline
        env:
          PYTHONPATH: .
        run: python train_baseline.py
      - name: Run anomaly tests
        working-directory: ml/anomaly
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Run forecast tests
        working-directory: ml/forecast
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

  phase5-rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evidence and reasoning dependencies
        run: python -m pip install -r services/evidence/requirements.txt -r services/reasoning/requirements.txt
      - name: Run Phase 5 tests
        env:
          PYTHONPATH: algorithms/rag:services/reasoning:services/evidence
        run: |
          python -m unittest discover -s algorithms/rag/tests -v
          python -m unittest discover -s services/reasoning/tests -v
          python -m unittest discover -s services/evidence/tests -v

  phase7-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ingestion dependencies
        run: python -m pip install -r services/ingestion/requirements.txt
      - name: Verify deterministic replay and idempotency
        env:
          PYTHONPATH: services/ingestion
        run: python -m unittest tests.phase7.test_replay_acceptance -v
      - name: Verify failure recovery behavior
        env:
          PYTHONPATH: services/ingestion
        run: python -m unittest tests.phase7.test_failure_recovery -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ingestion dependencies
        run: python -m pip install -r services/ingestion/requirements.txt
      - name: Start ingestion stack
        run: docker compose up -d --build ingestion
      - name: Run Docker integration contract
        env:
          AEGIS_INTEGRATION: '1'
          PYTHONPATH: services/ingestion
        run: python -m unittest services.ingestion.tests.test_runtime_integration -v
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color ingestion redpanda minio redis
      - name: Stop ingestion stack
        if: always()
        run: docker compose down -v
